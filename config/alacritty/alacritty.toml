# OneDark "darker" palette — matches nvim (transparent nvim now blends seamlessly)

[env]
TERM = "alacritty"

[window]
opacity = 0.82   # blur comes from the compositor (hypr/conf/decoration.conf)
dynamic_padding = true
decorations = "none"
dynamic_title = true

[window.padding]
x = 14
y = 14

[scrolling]
history = 10000
multiplier = 3

# "FiraCode Nerd Font Mono" ships the devicon/powerline glyphs neo-tree and
# lualine use, at fixed monospace advance — plain "FiraCode" had no coverage,
# so those glyphs came from whatever fallback fontconfig picked and rendered
# at inconsistent widths in the tree.
[font]
size = 12.0

[font.normal]
family = "FiraCode Nerd Font Mono"
style = "Regular"

[font.bold]
family = "FiraCode Nerd Font Mono"
style = "Bold"

[font.italic]
family = "FiraCode Nerd Font Mono"
style = "Italic"

[font.bold_italic]
family = "FiraCode Nerd Font Mono"
style = "Bold Italic"

[font.offset]
y = 1

[cursor]
style = { shape = "Beam", blinking = "On" }
blink_interval = 600
unfocused_hollow = true
thickness = 0.18

[selection]
save_to_clipboard = true

[mouse]
hide_when_typing = true

# OneDark darker colors — exact match to navarasu/onedark.nvim style="darker"
[colors.primary]
background = "#1b1f27"
foreground = "#abb2bf"
dim_foreground = "#6b727f"

[colors.cursor]
text = "#1b1f27"
cursor = "#abb2bf"

[colors.vi_mode_cursor]
text = "#1b1f27"
cursor = "#56b6c2"

[colors.search.matches]
foreground = "#1b1f27"
background = "#e5c07b"

[colors.search.focused_match]
foreground = "#1b1f27"
background = "#98c379"

[colors.footer_bar]
foreground = "#abb2bf"
background = "#262a33"

[colors.line_indicator]
foreground = "None"
background = "None"

[colors.selection]
text = "CellForeground"
background = "#3e4452"

[colors.normal]
black   = "#1b1f27"
red     = "#e06c75"
green   = "#98c379"
yellow  = "#e5c07b"
blue    = "#61afef"
magenta = "#c678dd"
cyan    = "#56b6c2"
white   = "#abb2bf"

[colors.bright]
black   = "#5c6370"
red     = "#e06c75"
green   = "#98c379"
yellow  = "#e5c07b"
blue    = "#61afef"
magenta = "#c678dd"
cyan    = "#56b6c2"
white   = "#ffffff"

[colors.dim]
black   = "#1b1f27"
red     = "#be5046"
green   = "#7a9f60"
yellow  = "#d19a66"
blue    = "#4d96d6"
magenta = "#a368b3"
cyan    = "#46939c"
white   = "#828791"

[[keyboard.bindings]]
key = "F11"
action = "ToggleFullscreen"

[[keyboard.bindings]]
key = "Equals"
mods  = "Control"
action = "IncreaseFontSize"

[[keyboard.bindings]]
key = "Minus"
mods = "Control"
action = "DecreaseFontSize"

[[keyboard.bindings]]
key = "Key0"
mods = "Control"
action = "ResetFontSize"

[[keyboard.bindings]]
key = "Return"
mods = "Shift"
chars = "\u001B\r"
