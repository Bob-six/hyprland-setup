# Docs: https://wiki.hypr.land/Hypr-Ecosystem/hyprpaper/
# Wallpapers live in ~/Pictures/wallpapers (install.sh copies them from the
# repo's wallpapers/). Change one with SUPER+W — that rewrites the paths below.

splash = false
ipc = true      # required by SUPER+W (hyprctl hyprpaper ...)

preload = ~/Pictures/wallpapers/wallpaper6-teal-curves.jpg

# Empty monitor = every output, including ones plugged in later
wallpaper {
    monitor =
    path = ~/Pictures/wallpapers/wallpaper6-teal-curves.jpg
    fit_mode = cover   # cover | contain | fill | tile
}
