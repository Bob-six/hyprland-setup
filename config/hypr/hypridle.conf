# Docs: https://wiki.hypr.land/Hypr-Ecosystem/hypridle/
general {
    lock_cmd = pidof hyprlock || ~/.config/hypr/scripts/lock.sh
    before_sleep_cmd = loginctl lock-session
    after_sleep_cmd = hyprctl dispatch dpms on
}

# Dim the backlight first as a warning, restore it on any input
listener {
    timeout = 240                          # 4 min
    on-timeout = brightnessctl -s set 10%
    on-resume = brightnessctl -r
}

# Lock after 5 minutes idle
listener {
    timeout = 300
    on-timeout = loginctl lock-session      # routes through the guarded lock_cmd above
}

listener {
    timeout = 330                          # 30s after lock, screen off
    on-timeout = hyprctl dispatch dpms off
    on-resume  = hyprctl dispatch dpms on
}

listener {
    timeout = 600                          # 10 min, suspend
    on-timeout = systemctl suspend
}
