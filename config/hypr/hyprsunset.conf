max-gamma = 700 

profile {
    time = 7:30
    identity = true
}

profile {
    time = 21:00
    # Lower Kelvin = warmer. 6500 is neutral daylight, 4000 is a mild night
    # light. 20000 was backwards — that's max *blue*, worse than no filter.
    # No "K" suffix: the value is parsed as a plain int.
    temperature = 4000
    # gamma = 0.8
}
