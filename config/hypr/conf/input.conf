# Docs: https://wiki.hypr.land/Configuring/Variables/#input
input {
    kb_layout = us,ir
    kb_variant =
    kb_model =
    kb_options = grp:alt_shift_toggle   # ALT+SHIFT switches layout
    kb_rules =

    follow_mouse = 1
    sensitivity = 0 # -1.0 - 1.0, 0 means no modification.

    # Send keys to the window under the cursor on the special workspace too
    special_fallthrough = true

    touchpad {
        natural_scroll = false
        disable_while_typing = true   # no more cursor jumps mid-sentence
        clickfinger_behavior = true   # two/three-finger tap = right/middle click
    }
}

# Per-device overrides go in conf/host.conf — `hyprctl devices` lists names, e.g.
# device {
#     name = logitech-usb-receiver
#     sensitivity = -0.2
# }
