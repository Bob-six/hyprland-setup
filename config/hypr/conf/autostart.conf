# Docs: https://wiki.hypr.land/Configuring/Keywords/#executing

exec-once = waybar
exec-once = hyprpaper
exec-once = dunst
exec-once = hypridle
exec-once = hyprsunset                 # night-light schedule, see hyprsunset.conf
exec-once = systemctl --user start hyprpolkitagent   # GUI password prompts
exec-once = nm-applet --indicator

# Clipboard history, read back with SUPER+V
exec-once = wl-paste --type text --watch cliphist store
exec-once = wl-paste --type image --watch cliphist store

# Make xdg-desktop-portal see the session env (screen sharing, file pickers)
exec-once = dbus-update-activation-environment --systemd WAYLAND_DISPLAY XDG_CURRENT_DESKTOP
