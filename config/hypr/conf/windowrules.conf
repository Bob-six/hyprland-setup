# Docs: https://wiki.hypr.land/Configuring/Window-Rules/
# 0.55 syntax: windowrule = <property> <value>, match:<field> <regex>
# Boolean properties need an explicit 1/0, and names are snake_case
# (no_focus, not nofocus).

# ── Tearing: lower input latency in fullscreen games ───────────────
windowrule = immediate 1, match:class ^(steam_app_.*)$
windowrule = immediate 1, match:class ^(cs2|gamescope)$

# ── Small dialogs belong in a floating, centered window ────────────
windowrule = float 1, match:class ^(pavucontrol|blueman-manager|nm-connection-editor)$
windowrule = float 1, match:class ^(org.pulseaudio.pavucontrol)$
windowrule = float 1, match:class ^(qt6ct|nwg-look)$
windowrule = float 1, match:title ^(Open File|Open Folder|Save As|Save File|Choose Files)$
windowrule = center 1, match:class ^(pavucontrol|blueman-manager|nm-connection-editor)$
windowrule = size 60% 60%, match:class ^(pavucontrol|blueman-manager|nm-connection-editor)$

# Picture-in-picture: float it, keep it on top of everything, follow me around
windowrule = float 1, match:title ^(Picture-in-Picture)$
windowrule = pin 1, match:title ^(Picture-in-Picture)$
windowrule = size 25% 25%, match:title ^(Picture-in-Picture)$

# ── Don't let the screen blank mid-video ───────────────────────────
windowrule = idle_inhibit fullscreen, match:class ^(mpv|vlc|google-chrome|chromium|brave-browser|firefox)$

# ── Apps that try to maximize themselves on launch ─────────────────
windowrule = suppress_event maximize, match:class ^(.*)$

# No layerrules here on purpose: the usual ones (blur on rofi/waybar) do
# nothing while decoration:blur is disabled in conf/decoration.conf.
