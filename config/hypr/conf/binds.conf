# Docs: https://wiki.hypr.land/Configuring/Binds/
#
# Every bind carries a description via the `d` flag. `hyprctl binds` reports
# those descriptions, and that is what the SUPER+/ cheat sheet renders — so a
# bind documented here can never drift out of sync with the docs.
#
# Flags:
#   d  has a description
#   e  repeats while held      (volume, brightness, resize)
#   l  fires even when locked  (media and hardware keys)
#   m  mouse bind

$mainMod = SUPER
$term = alacritty
$browser = google-chrome-stable
$files = thunar
$scripts = ~/.config/hypr/scripts

# ── Launch ─────────────────────────────────────────────────────────
bindd = $mainMod, RETURN, Terminal, exec, $term
bindd = $mainMod SHIFT, RETURN, Terminal (kitty), exec, kitty
bindd = $mainMod, R, App launcher, exec, rofi -show drun -replace
bindd = $mainMod, B, Browser, exec, $browser
bindd = $mainMod, E, File manager, exec, $files
bindd = $mainMod, V, Clipboard history, exec, $scripts/clipboard.sh
bindd = $mainMod, W, Change wallpaper, exec, $scripts/wallpaper.sh
bindd = $mainMod, slash, Show these keybinds, exec, $scripts/keybinds.sh

# ── Session ────────────────────────────────────────────────────────
bindd = $mainMod, L, Lock screen, exec, $scripts/lock.sh
bindd = $mainMod, X, Power menu, exec, wlogout -b 4
bindd = $mainMod SHIFT, M, Exit Hyprland, exit
bindd = $mainMod SHIFT, B, Restart waybar, exec, killall waybar; waybar & disown
bindd = $mainMod CTRL, B, Hide/show waybar, exec, killall -SIGUSR1 waybar
bindd = $mainMod, N, Show last notification, exec, dunstctl history-pop
bindd = $mainMod SHIFT, N, Dismiss all notifications, exec, dunstctl close-all

# ── Window ─────────────────────────────────────────────────────────
bindd = $mainMod, Q, Close window, killactive
bindd = $mainMod, T, Float/tile window, togglefloating
bindd = $mainMod, F, Fullscreen, fullscreen, 0
bindd = $mainMod SHIFT, F, Maximize (keep the bar), fullscreen, 1
bindd = $mainMod, C, Center floating window, centerwindow
bindd = $mainMod SHIFT, P, Pin window to every workspace, pin
bindd = $mainMod, P, Pseudotile, pseudo
bindd = $mainMod, J, Toggle split direction, layoutmsg, togglesplit
bindd = $mainMod, TAB, Next window, cyclenext
bindd = $mainMod SHIFT, TAB, Previous window, cyclenext, prev

bindd = $mainMod, left, Focus left, movefocus, l
bindd = $mainMod, right, Focus right, movefocus, r
bindd = $mainMod, up, Focus up, movefocus, u
bindd = $mainMod, down, Focus down, movefocus, d

bindd = $mainMod SHIFT, left, Move window left, movewindow, l
bindd = $mainMod SHIFT, right, Move window right, movewindow, r
bindd = $mainMod SHIFT, up, Move window up, movewindow, u
bindd = $mainMod SHIFT, down, Move window down, movewindow, d

binded = $mainMod CTRL, left, Shrink window horizontally, resizeactive, -40 0
binded = $mainMod CTRL, right, Grow window horizontally, resizeactive, 40 0
binded = $mainMod CTRL, up, Shrink window vertically, resizeactive, 0 -40
binded = $mainMod CTRL, down, Grow window vertically, resizeactive, 0 40

# Scratchpad — a hidden workspace toggled over whatever you are on
bindd = $mainMod, Z, Toggle scratchpad, togglespecialworkspace, magic
bindd = $mainMod SHIFT, Z, Send window to scratchpad, movetoworkspacesilent, special:magic

# ── Workspaces ─────────────────────────────────────────────────────
# 1-10 on the primary screen
bindd = $mainMod, 1, Workspace 1, workspace, 1
bindd = $mainMod, 2, Workspace 2, workspace, 2
bindd = $mainMod, 3, Workspace 3, workspace, 3
bindd = $mainMod, 4, Workspace 4, workspace, 4
bindd = $mainMod, 5, Workspace 5, workspace, 5
bindd = $mainMod, 6, Workspace 6, workspace, 6
bindd = $mainMod, 7, Workspace 7, workspace, 7
bindd = $mainMod, 8, Workspace 8, workspace, 8
bindd = $mainMod, 9, Workspace 9, workspace, 9
bindd = $mainMod, 0, Workspace 10, workspace, 10

# 11-14 on the second screen — pinning lives in conf/host.conf
bindd = $mainMod, A, Workspace 11, workspace, 11
bindd = $mainMod, S, Workspace 12, workspace, 12
bindd = $mainMod, D, Workspace 13, workspace, 13
bindd = $mainMod, G, Workspace 14, workspace, 14

bindd = $mainMod SHIFT, 1, Move window to workspace 1, movetoworkspace, 1
bindd = $mainMod SHIFT, 2, Move window to workspace 2, movetoworkspace, 2
bindd = $mainMod SHIFT, 3, Move window to workspace 3, movetoworkspace, 3
bindd = $mainMod SHIFT, 4, Move window to workspace 4, movetoworkspace, 4
bindd = $mainMod SHIFT, 5, Move window to workspace 5, movetoworkspace, 5
bindd = $mainMod SHIFT, 6, Move window to workspace 6, movetoworkspace, 6
bindd = $mainMod SHIFT, 7, Move window to workspace 7, movetoworkspace, 7
bindd = $mainMod SHIFT, 8, Move window to workspace 8, movetoworkspace, 8
bindd = $mainMod SHIFT, 9, Move window to workspace 9, movetoworkspace, 9
bindd = $mainMod SHIFT, 0, Move window to workspace 10, movetoworkspace, 10
bindd = $mainMod SHIFT, A, Move window to workspace 11, movetoworkspace, 11
bindd = $mainMod SHIFT, S, Move window to workspace 12, movetoworkspace, 12
bindd = $mainMod SHIFT, D, Move window to workspace 13, movetoworkspace, 13
bindd = $mainMod SHIFT, G, Move window to workspace 14, movetoworkspace, 14

bindd = $mainMod, grave, Back to previous workspace, workspace, previous

# ── Multi-monitor ──────────────────────────────────────────────────
bindd = $mainMod ALT, left, Focus the monitor to the left, focusmonitor, l
bindd = $mainMod ALT, right, Focus the monitor to the right, focusmonitor, r
bindd = $mainMod ALT SHIFT, left, Move workspace to left monitor, movecurrentworkspacetomonitor, l
bindd = $mainMod ALT SHIFT, right, Move workspace to right monitor, movecurrentworkspacetomonitor, r

# ── Screenshots ────────────────────────────────────────────────────
bindd = , Print, Screenshot region to clipboard, exec, $scripts/screenshot.sh region
bindd = $mainMod, Print, Screenshot region to file, exec, $scripts/screenshot.sh save
bindd = $mainMod SHIFT, Print, Screenshot whole screen to clipboard, exec, $scripts/screenshot.sh screen
bindd = $mainMod CTRL, Print, Screenshot region and annotate, exec, $scripts/screenshot.sh edit

# ── Media & hardware keys ──────────────────────────────────────────
bindeld = , XF86AudioRaiseVolume, Volume up, exec, wpctl set-volume -l 1.4 @DEFAULT_AUDIO_SINK@ 5%+
bindeld = , XF86AudioLowerVolume, Volume down, exec, wpctl set-volume -l 1.4 @DEFAULT_AUDIO_SINK@ 5%-
bindeld = , XF86MonBrightnessUp, Brightness up, exec, brightnessctl set 10%+
bindeld = , XF86MonBrightnessDown, Brightness down, exec, brightnessctl set 10%-
bindld = , XF86AudioMute, Mute output, exec, wpctl set-mute @DEFAULT_AUDIO_SINK@ toggle
bindld = , XF86AudioMicMute, Mute microphone, exec, wpctl set-mute @DEFAULT_AUDIO_SOURCE@ toggle
bindld = , XF86WLAN, Toggle wifi, exec, nmcli radio wifi toggle
bindld = , XF86AudioPlay, Play/pause, exec, playerctl play-pause
bindld = , XF86AudioNext, Next track, exec, playerctl next
bindld = , XF86AudioPrev, Previous track, exec, playerctl previous

bindd = $mainMod, SPACE, Play/pause, exec, playerctl play-pause
bindd = $mainMod, bracketright, Next track, exec, playerctl next
bindd = $mainMod, bracketleft, Previous track, exec, playerctl previous

# Lid close locks the session before suspend, so nothing is on screen on wake
bindld = , switch:on:Lid Switch, Lock on lid close, exec, loginctl lock-session

# ── Mouse ──────────────────────────────────────────────────────────
bindm = $mainMod, mouse:272, movewindow
bindm = $mainMod, mouse:273, resizewindow
bindd = $mainMod, mouse_down, Next workspace, workspace, e+1
bindd = $mainMod, mouse_up, Previous workspace, workspace, e-1
