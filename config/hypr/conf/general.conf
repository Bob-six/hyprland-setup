# Docs: https://wiki.hypr.land/Configuring/Variables/
general {
    gaps_in = 0
    gaps_out = 0
    border_size = 0
    col.active_border = rgba(33ccffee) rgba(00ff99ee) 45deg
    col.inactive_border = rgba(595959aa)
    layout = dwindle
    resize_on_border = true
    allow_tearing = true   # fullscreen games may tear -> lower input latency (see windowrules.conf)

    # border_size is 0, so let the pointer grab a window edge from just outside it
    extend_border_grab_area = 15

    # Drag a floating window near an edge and it snaps there
    snap {
        enabled = true
        window_gap = 10
        monitor_gap = 10
    }
}
