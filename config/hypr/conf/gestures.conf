# Docs: https://wiki.hypr.land/Configuring/Gestures/
#
# The old `gestures { workspace_swipe = true }` block was removed in Hyprland
# 0.55 — the option no longer exists (`hyprctl getoption gestures:workspace_swipe`
# → "no such option"), which is why the previous config's commented-out block
# would never have worked. This is the current syntax:
#   gesture = <fingers>, <direction>, <action>

# Three fingers sideways on the touchpad = switch workspace
gesture = 3, horizontal, workspace

# Four fingers up = scratchpad, four down = close the window under the cursor
gesture = 4, up, special, magic
gesture = 4, down, close
