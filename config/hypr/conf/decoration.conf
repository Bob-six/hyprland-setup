# See https://wiki.hyprland.org/Configuring/Variables/ for more
# Performance-first: every effect below is a per-frame GPU cost, so all off.
decoration {
    rounding = 0          # rounded corners need extra fragment work

    active_opacity   = 1.0  # any value < 1.0 forces transparency compositing
    inactive_opacity = 1.0
    dim_inactive     = false

    blur {
        enabled = false   # by far the biggest GPU cost — off
    }

    shadow {
        enabled = false
    }
}
