# See https://wiki.hyprland.org/Configuring/Variables/ for more
# Performance-first: every effect below is a per-frame GPU cost, so all off.
decoration {
    rounding = 0          # rounded corners need extra fragment work

    active_opacity   = 1.0  # any value < 1.0 forces transparency compositing
    inactive_opacity = 1.0
    dim_inactive     = false

    blur {
        # Only applies to windows that are actually translucent (alacritty
        # sets its own opacity), so the cost is one window, not the desktop.
        enabled = true
        size    = 6
        passes  = 2
        new_optimizations = true
        xray    = false
        noise   = 0.015
        contrast = 1.1
        brightness = 0.85   # darken behind the terminal so text stays readable
    }

    shadow {
        enabled = false
    }
}
