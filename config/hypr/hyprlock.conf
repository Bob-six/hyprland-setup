# Docs: https://wiki.hypr.land/Hypr-Ecosystem/hyprlock/

background {
    monitor =
    path = ~/Pictures/wallpapers/wallpaper8-electric-wilderness.jpg
    blur_passes = 0                       # 0 = no blur -> noticeably lower GPU/CPU
    blur_size = 0
    brightness = 0.8                      # slight dimming looks nice on dark wp
    contrast = 0.9
}

general {
    immediate_render = true          # helps a tiny bit with initial draw
    fractional_scaling = 2           # usually best
    hide_cursor = true
}

# Auth feedback comes from PAM.
# Lockout (see pam/): 5 fails → 1 min, 10 fails → 5 min, 15 fails → 10 min.
auth {
    fingerprint {
        enabled = false              # flip to true on a laptop with a reader
    }
}

input-field {
    monitor =
    size = 200, 50
    outline_thickness = 3
    dots_size = 0.33 # Scale of input-field height, 0.2 - 0.8
    dots_spacing = 0.15 # Scale of dots' absolute size, 0.0 - 1.0
    dots_center = true
    dots_rounding = -1 # -1 default circle, -2 follow input-field rounding
    outer_color = rgb(151515)
    inner_color = rgb(FFFFFF)
    font_color = rgb(10, 10, 10)
    fade_on_empty = true
    fade_timeout = 1000 # Milliseconds before fade_on_empty is triggered.
    placeholder_text = <i>Input Password...</i>
    hide_input = false
    rounding = -1 # -1 means complete rounding (circle/oval)
    check_color = rgb(204, 136, 34)
    fail_color = rgb(204, 34, 34)
    fail_text = <i>$FAIL <b>($ATTEMPTS)</b></i>
    fail_transition = 300
    capslock_color = -1
    numlock_color = -1
    bothlock_color = -1
    invert_numlock = false
    swap_font_color = false
    position = 0, -20
    halign = center
    valign = center
}

label {
    monitor =
    #clock
    text = cmd[update:1000] echo "$TIME"
    color = rgba(200, 200, 200, 1.0)
    font_size = 55
    font_family = Fira Semibold
    position = -100, 40
    halign = right
    valign = bottom
    shadow_passes = 5
    shadow_size = 10
}

label {
    monitor =
    text = $USER
    color = rgba(200, 200, 200, 1.0)
    font_size = 20
    font_family = Fira Semibold
    position = -100, 160
    halign = right
    valign = bottom
    shadow_passes = 5
    shadow_size = 10
}

# Which keyboard layout is active — the lock script forces us, but if you
# switch while locked this tells you why the password is being rejected.
label {
    monitor =
    text = cmd[update:250] hyprctl devices -j | jq -r '.keyboards[] | select(.main) | .active_keymap'
    color = rgba(200, 200, 200, 0.6)
    font_size = 14
    font_family = Fira Semibold
    position = 0, -90
    halign = center
    valign = center
}
